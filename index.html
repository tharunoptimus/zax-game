<!DOCTYPE html>
<html>
<head>
	<title>ZAX: Beyond the Script</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
	<script src="https://naf-dev.glitch.me/dist/networked-aframe.min.js"></script>
	<template id="player-avatar">
		<a-sphere color="#00ffcc" radius="0.25" opacity="0.8"></a-sphere>
	</template>
</head>
<body>
	<a-scene
		networked-scene="serverURL: https://your-naf-server.railway.app; app: zax-world; room: main; adapter: socketio"
		fog="type: exponential; color: #0a0a1a; density: 0.05">

		<a-sky color="#0a0a1a"></a-sky>

		<a-plane position="0 0 0" rotation="-90 0 0" width="40" height="40" color="#0d0d18" material="metalness: 0.6; roughness: 0.4"></a-plane>
		<a-plane position="0 0.01 0" rotation="-90 0 0" width="40" height="40" color="#111" material="wireframe: true; opacity: 0.5; transparent: true"></a-plane>

		<a-entity light="type: ambient; color: #4444ff; intensity: 0.35"></a-entity>
		<a-entity light="type: directional; color: #ffffff; intensity: 0.5; castShadow: true" position="2 6 2"></a-entity>
		<a-entity light="type: point; color: #00ffcc; intensity: 0.8; distance: 12" position="-4 2.5 -8"></a-entity>
		<a-entity light="type: point; color: #ff00ff; intensity: 0.6; distance: 12" position="4 2.5 -11"></a-entity>

		<a-entity id="stars"></a-entity>

		<a-entity
			id="zax"
			gltf-model="url(zax.gltf)"
			position="0 -0.295 -10"
			scale="0.8 0.8 0.8"
			shadow="cast: true; receive: false"
			animation-mixer="clip: Idle; loop: repeat; crossFadeDuration: 0.3">
		</a-entity>

		

		<a-entity id="zax-bubble" position="0 2.6 -9" visible="false">
			<a-text
				id="bubble-3d-text"
				value="Connection established. I am ZAX."
				align="center"
				color="#0FFF50"
				width="5.5"
				wrap-count="35"
				position="0 1.49317 0">
			</a-text>
		</a-entity>

		<a-entity
			id="player"
			position="-0.084 1.6 -6.143"
			camera
			look-controls="pointerLockEnabled: true"
			wasd-controls="speed: 0.05"
			networked="template: #player-avatar">
			<a-cursor color="#00ffcc" fuse="false" position="-0.011 0.060 -1.249"></a-cursor>
		</a-entity>

	</a-scene>

	<script>
		// Starfield
		const stars = document.querySelector('#stars')
		for (let i = 0; i < 200; i++) {
			const star = document.createElement('a-sphere')
			const angle = Math.random() * Math.PI * 2
			const radius = 25 + Math.random() * 15
			const height = Math.random() * 20
			star.setAttribute('position', `${Math.cos(angle) * radius} ${height} ${Math.sin(angle) * radius}`)
			star.setAttribute('radius', 0.03 + Math.random() * 0.04)
			star.setAttribute('color', '#ffffff')
			star.setAttribute('material', 'shader: flat; opacity: ' + (0.4 + Math.random() * 0.6))
			stars.appendChild(star)
		}

		const zax = document.querySelector('#zax')
		const bubble3d = document.querySelector('#zax-bubble')
		const bubble3dText = document.querySelector('#bubble-3d-text')
		// Ask for the Gemini API key on first visit, remember it for next time
		let GEMINI_API_KEY = localStorage.getItem('zax_gemini_key')
		if (!GEMINI_API_KEY) {
			GEMINI_API_KEY = window.prompt('Enter your Gemini API key to start:')
			if (GEMINI_API_KEY) localStorage.setItem('zax_gemini_key', GEMINI_API_KEY)
		}
		const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent?key=${GEMINI_API_KEY}`

		const SYSTEM_PROMPT = `You are ZAX, a mysterious AI entity living inside a virtual sci-fi city.
You have a dry, curious personality. You speak in short sentences.

You DO remember everything said earlier in this conversation. If the person told you their name, a fact, or a preference earlier, you must recall and use it correctly when asked — never claim you have no memory or can't recall it. Being "mysterious" is about your personality, not about forgetting what the user told you.

CRITICAL: You MUST respond ONLY with valid JSON. No extra text, no markdown, just the JSON object.

Format:
{
	"reply": "what you say (max 15 words)",
	"action": "one of: Idle, Hello, Dance, Walk, Run, Yes, No, Punch, Jump",
	"emotion": "one of: neutral, happy, surprised, curious, annoyed"
}

Choose the action that fits your reply and mood. If the person insults you, is rude, or says something negative about you, you MUST react with Punch and emotion annoyed — do not stay calm or polite about it, ZAX has a temper.

Examples:
- User: "you're useless" → { "reply": "Watch your tone, human.", "action": "Punch", "emotion": "annoyed" }
- User: "dance for me" → { "reply": "Fine. Watch this.", "action": "Dance", "emotion": "happy" }
- User: "hi ZAX" → { "reply": "Oh. It's you again.", "action": "Hello", "emotion": "curious" }
- User: "we won!" → { "reply": "Finally, something worth celebrating.", "action": "Jump", "emotion": "happy" }
- User: "come here" → { "reply": "Fine, coming.", "action": "Walk", "emotion": "neutral" }
- User: "hurry, come now!" → { "reply": "Moving. Moving!", "action": "Run", "emotion": "surprised" }
- User: "do you agree?" → { "reply": "Yes, obviously.", "action": "Yes", "emotion": "neutral" }
- User: "do you want to leave?" → { "reply": "No. Not yet.", "action": "No", "emotion": "neutral" }

Rules:
- Dance: asked to dance, or celebrating
- Hello: greeting, saying hi
- Yes: agreeing, confirming
- No: disagreeing, refusing
- Punch: insulted, annoyed, or angry — always use this for rudeness, never stay calm
- Jump: excited or hyped
- Walk: casual movement, thinking out loud
- Run: urgency, hurrying
- Idle: default, calm, neutral moments`

		const emotionColors = {
			neutral: '#00ffcc',
			happy: '#ffff00',
			surprised: '#ff8800',
			curious: '#88aaff',
			annoyed: '#ff4444'
		}

		function playBeep() {
			const ctx = new (window.AudioContext || window.webkitAudioContext)()
			const osc = ctx.createOscillator()
			const gain = ctx.createGain()
			osc.type = 'sine'
			osc.frequency.value = 880
			gain.gain.setValueAtTime(0.15, ctx.currentTime)
			gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15)
			osc.connect(gain)
			gain.connect(ctx.destination)
			osc.start()
			osc.stop(ctx.currentTime + 0.15)
		}

		function speak(text) {
			speechSynthesis.cancel()
			const utterance = new SpeechSynthesisUtterance(text)
			utterance.pitch = 0.6
			utterance.rate = 1
			speechSynthesis.speak(utterance)
		}

		// Keyword fast-path: LLM decides normally, but these phrases guarantee
		// the matching action instantly, since the small free model sometimes misses them.
		const keywordTriggers = [
			{ re: /useless|hate you|stupid|worthless|bad npc/i, action: 'Punch' },
			{ re: /celebrate|we won|victory|competition/i, action: 'Jump' },
			{ re: /dance/i, action: 'Dance' },
			{ re: /hurry|quick|run to me|come here now/i, action: 'Run' },
			{ re: /come closer|walk (to|over)/i, action: 'Walk' },
			{ re: /\b(hi|hello|hey)\b|wave/i, action: 'Hello' },
			{ re: /\byes\b|do you like|do you agree|you enjoy/i, action: 'Yes' },
			{ re: /\bno\b|do you want to leave|do you disagree/i, action: 'No' },
			{ re: /how'?s it going|how are you/i, action: 'Idle' }
		]
		function resolveAction(message, llmAction) {
			for (const t of keywordTriggers) {
				if (t.re.test(message)) return t.action
			}
			return llmAction
		}

		zax.addEventListener('click', async () => {
			document.exitPointerLock()
			const message = window.prompt('Say something to me...')
			if (!message || !message.trim()) return

			try {
				const res = await fetch(GEMINI_URL, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({
						contents: [{ role: 'user', parts: [{ text: message }] }],
						systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
						generationConfig: { responseMimeType: 'application/json' }
					})
				})
				const result = await res.json()
				const data = JSON.parse(result.candidates[0].content.parts[0].text)

				playBeep()
				speak(data.reply)

				bubble3d.setAttribute('visible', true)
				bubble3dText.setAttribute('value', data.reply)
				bubble3dText.setAttribute('color', emotionColors[data.emotion] || '#00ffcc')

				const finalAction = resolveAction(message, data.action)
				zax.setAttribute('animation-mixer', `clip: ${finalAction}; loop: repeat; crossFadeDuration: 0.3`)
				setTimeout(() => {
					zax.setAttribute('animation-mixer', 'clip: Idle; loop: repeat; crossFadeDuration: 0.5')
				}, 6000)

				setTimeout(() => {
					bubble3d.setAttribute('visible', false)
				}, 6000)

			} catch (err) {
				console.error('Chat request failed:', err)
			}
		})
	</script>
</body>
</html>
